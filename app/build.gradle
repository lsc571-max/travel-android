plugins {
    id 'com.android.application'
}

// GitHub에서 만들 때마다 버전 번호가 1씩 올라감 → 새 설치 파일을 덮어 설치할 수 있음
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'kr.pureun.travel'
    compileSdk 34

    defaultConfig {
        applicationId 'kr.pureun.travel'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 항상 같은 서명 키를 써야 기존 앱 위에 덮어 설치(자료 유지)가 됨
    signingConfigs {
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // 배포용 (A26부터 GitHub가 만드는 설치 파일): 디버깅 끔 · 서명 키는 예전과 같은 키 → 덮어 설치하면 자료가 남음
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    // 음성 인식 엔진(sherpa-onnx)의 자바 연결 코드 — 빌드할 때 내려받아 여기에 둠
    sourceSets {
        main {
            java.srcDirs += 'src/sherpa/java'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // 번역 엔진(libllama_server.so)은 실행 파일이라 설치할 때 풀려 있어야 함
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

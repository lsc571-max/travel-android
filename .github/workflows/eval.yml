name: 후보 모델 시험
on:
  push:
    branches: [eval]
jobs:
  stt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q sherpa-onnx "datasets<4" soundfile numpy huggingface_hub
      - run: python eval/stt_eval.py small turbo medium large-v3
  llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 엔진(llama.cpp) 준비
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir bin && cd bin
          if gh release download b12367 -R ggml-org/llama.cpp -p 'llama-*-bin-ubuntu-x64.*' 2>/dev/null; then
            for f in *; do case "$f" in *.zip) unzip -q "$f";; *.tar.gz) tar xzf "$f";; esac; done
          fi
          S=$(find . -name llama-server -type f | head -1)
          if [ -z "$S" ]; then
            git clone -q --depth 1 --branch b12367 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B b -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF >/dev/null
            cmake --build b --target llama-server -j 4 >/dev/null
            S=$(find b -name llama-server -type f | head -1)
          fi
          chmod +x "$S"; echo "SRV=$(realpath "$S")" >> $GITHUB_ENV; echo "LD_LIBRARY_PATH=$(dirname "$(realpath "$S")")" >> $GITHUB_ENV
      - run: python3 eval/llm_eval.py "$SRV"

name: 설치 파일(APK) 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LLAMA_TAG: b12367   # 폰 안 번역 엔진(llama.cpp) 버전
  SHERPA_VER: 2.0.1   # 폰 안 음성 인식 엔진(sherpa-onnx) 버전

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 번역 엔진은 한 번 만들면 저장해 두고 다시 씀 (처음만 10분쯤 걸림)
      - name: 번역 엔진 저장분 확인
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama-out
          key: llama-server-${{ env.LLAMA_TAG }}-android-arm64-v1

      - name: 번역 엔진(llama.cpp) 만들기
        if: steps.llama-cache.outputs.cache-hit != 'true'
        continue-on-error: true   # 실패해도 앱은 만들어짐 (그 경우 폰 AI 없이 무료 번역기·Gemini만)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_USE_PREBUILT_UI=OFF
          cmake --build llama-build --target llama-server -j "$(nproc)"
          mkdir -p llama-out
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" -o llama-out/libllama_server.so llama-build/bin/llama-server
          ls -la llama-out

      - name: 번역 엔진을 앱에 넣기
        run: |
          if [ -f llama-out/libllama_server.so ]; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp llama-out/libllama_server.so app/src/main/jniLibs/arm64-v8a/
            echo "번역 엔진 포함"
          else
            echo "::warning::번역 엔진을 만들지 못했습니다. 폰 AI 없이 앱을 만듭니다."
          fi

      # 폰 안 음성 인식 엔진: 미리 만들어진 라이브러리 + 자바 연결 코드 + 말소리 감지 모델
      - name: 음성 인식 엔진(sherpa-onnx) 넣기
        run: |
          set -e
          B="https://github.com/k2-fsa/sherpa-onnx/releases/download"
          curl -fL --retry 3 -o sherpa-android.tar.bz2 "$B/v$SHERPA_VER/sherpa-onnx-v$SHERPA_VER-android.tar.bz2"
          mkdir -p sherpa-android app/src/main/jniLibs/arm64-v8a app/src/main/assets
          tar xjf sherpa-android.tar.bz2 -C sherpa-android
          for f in libsherpa-onnx-jni.so libonnxruntime.so; do
            cp "$(find sherpa-android -path '*arm64-v8a*' -name "$f" | head -1)" app/src/main/jniLibs/arm64-v8a/
          done
          git clone --depth 1 --branch "v$SHERPA_VER" https://github.com/k2-fsa/sherpa-onnx sherpa-src
          mkdir -p app/src/sherpa/java
          cp -r sherpa-src/sherpa-onnx/java-api/src/main/java/com app/src/sherpa/java/
          curl -fL --retry 3 -o app/src/main/assets/silero_vad.onnx "$B/asr-models/silero_vad.onnx"
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 앱 만들기
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk travel-interpreter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: travel-interpreter-apk
          path: travel-interpreter.apk

      - name: 내려받기 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 여행 통역 앱 (최신)
          body: |
            휴대폰에서 아래 travel-interpreter.apk 를 눌러 받아 설치하세요.
            빌드 번호: ${{ github.run_number }}
          files: travel-interpreter.apk
          make_latest: true

  # 실제 모델과 녹음 파일로 폰 안 음성 인식 코드를 시험 (앱 만들기와 따로 돌고, 실패해도 설치 파일은 나옴)
  verify:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 모델 내려받기 주소 확인
        run: |
          for u in \
            https://huggingface.co/tencent/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B-Q4_K_M.gguf \
            https://huggingface.co/tencent/Hy-MT2-1.8B-GGUF/resolve/main/Hy-MT2-1.8B-Q6_K.gguf \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-encoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-decoder.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-whisper-small/resolve/main/small-tokens.txt \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/model.int8.onnx \
            https://huggingface.co/csukuangfj/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/tokens.txt ; do
            echo "URLCHECK $(curl -sIL -o /dev/null -w '%{http_code} %{size_download}' "$u") $(curl -sIL "$u" | grep -i '^content-length' | tail -1 | tr -d '\r') $u"
          done
      - name: 음성 인식 시험 (한국어·일본어·영어·중국어 녹음)
        run: |
          set -e
          B="https://github.com/k2-fsa/sherpa-onnx/releases/download"
          mkdir -p verify && cd verify
          curl -fsSL --retry 3 -o jni.tar.bz2 "$B/v$SHERPA_VER/sherpa-onnx-v$SHERPA_VER-linux-x64-jni.tar.bz2" && tar xjf jni.tar.bz2
          curl -fsSL --retry 3 -o vad.onnx "$B/asr-models/silero_vad.onnx"
          curl -fsSL --retry 3 -o sv.tar.bz2 "$B/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2" && tar xjf sv.tar.bz2
          H=https://huggingface.co/csukuangfj
          mkdir -p hf && for f in model.int8.onnx tokens.txt; do curl -fsSL --retry 3 -o hf/$f "$H/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/resolve/main/$f"; done
          mkdir -p ws && for f in small-encoder.int8.onnx small-decoder.int8.onnx small-tokens.txt; do curl -fsSL --retry 3 -o ws/$f "$H/sherpa-onnx-whisper-small/resolve/main/$f"; done
          git clone -q --depth 1 --branch "v$SHERPA_VER" https://github.com/k2-fsa/sherpa-onnx src
          mkdir -p out
          javac -nowarn -d out $(find src/sherpa-onnx/java-api/src/main/java -name '*.java') ../app/src/main/java/kr/pureun/travel/SttCore.java ../ci/kr/pureun/travel/SttCheck.java
          W=sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/test_wavs
          RUN="java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dsherpa_onnx.native.path=$PWD/sherpa-onnx-v$SHERPA_VER-linux-x64-jni/lib -cp out kr.pureun.travel.SttCheck vad.onnx"
          echo "== SenseVoice (앱이 받는 파일 그대로) · 언어 자동"
          $RUN sensevoice auto hf/model.int8.onnx,hf/tokens.txt $W/ko.wav $W/ja.wav $W/en.wav $W/zh.wav 2>/dev/null
          echo "== Whisper small (앱이 받는 파일 그대로) · 언어 자동"
          $RUN whisper auto ws/small-encoder.int8.onnx,ws/small-decoder.int8.onnx,ws/small-tokens.txt $W/ko.wav $W/ja.wav $W/en.wav $W/zh.wav 2>/dev/null
